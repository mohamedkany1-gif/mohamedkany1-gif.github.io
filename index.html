<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAKHZAN ERP | Sigma Petroleum Services | Refresh 22</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#09090b">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap">
<style>
:root {
  --bg: #09090b;
  --surface: #121215;
  --surface-hover: #1c1c21;
  --card: #18181b;
  --border: #27272a;
  --text: #fafafa;
  --muted: #a1a1aa;
  --accent: #dc2626;
  --accent-hover: #b91c1c;
  --success: #22c55e;
  --success-bg: rgba(34, 197, 94, 0.1);
  --danger: #ef4444;
  --danger-bg: rgba(239, 68, 68, 0.1);
  --radius: 6px;
  color-scheme: dark;
}

html {
  background: var(--bg);
  scroll-padding-top: env(safe-area-inset-top, 0px);
  scroll-behavior: smooth;
}
* { box-sizing: border-box; }

body {
  margin: 0 auto;
  max-width: 1180px;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.6 "Readex Pro", system-ui, -apple-system, sans-serif;
  padding: 24px 16px 120px;
  letter-spacing: -0.01em;
}

.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 28px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
h1 {
  font-size: 16px;
  font-weight: 700;
  margin: 0;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 10px;
}
h1::before {
  content: '';
  display: block;
  width: 8px;
  height: 16px;
  background: var(--accent);
}

input, select, textarea {
  width: 100%;
  height: 50px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text);
  padding: 0 16px;
  font: inherit;
  font-size: 14px;
  transition: border-color 0.2s ease, background 0.2s ease;
}
input:focus, select:focus {
  outline: none;
  border-color: var(--text);
  background: var(--surface-hover);
}

label {
  display: block;
  margin-bottom: 16px;
  font-size: 12.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
}
label input, label select {
  margin-top: 8px;
}

.chk {
  display: flex;
  gap: 12px;
  align-items: center;
  color: var(--text);
  font-size: 14px;
  cursor: pointer;
  background: var(--surface);
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 16px;
  transition: border-color 0.2s;
}
.chk:hover { border-color: var(--muted); }
.chk input {
  width: 20px;
  height: 20px;
  margin: 0;
  accent-color: var(--accent);
  cursor: pointer;
}

.btn {
  height: 50px;
  padding: 0 24px;
  border: 0;
  border-radius: var(--radius);
  background: var(--text);
  color: var(--bg);
  font: inherit;
  font-weight: 700;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  width: 100%;
  margin-top: 8px;
  cursor: pointer;
  transition: background 0.2s ease, transform 0.1s ease;
}
.btn:hover { background: var(--muted); }
.btn:active { transform: scale(0.99); }
.btn:disabled { opacity: 0.4; cursor: wait; transform: none; }

.ghost {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
}
.ghost:hover {
  background: var(--surface-hover);
  color: var(--text);
  border-color: var(--text);
}

.row { display: flex; gap: 12px; margin-top: 14px; }
.row .btn { margin: 0; flex: 1; }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin: 16px 0;
  overflow: hidden;
  border-inline-start: 4px solid var(--accent);
  transition: border-color 0.2s;
}
.card:hover { border-color: var(--muted); }
.card.neg { border-inline-start-color: var(--danger); }

.form {
  padding: 24px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.form[data-t=in] .o { display: none; }
.form[data-t=out] .i { display: none; }

.job { padding: 20px; }
.hd {
  box-sizing: border-box;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
  width: 100%;
  padding: 20px;
  background: transparent;
  border: 0;
  text-align: inherit;
  color: inherit;
  font: inherit;
}
.mute, .hd small {
  display: block;
  color: var(--muted);
  font-size: 12.5px;
  margin-top: 4px;
}
.desc-txt {
  color: var(--success);
  margin-top: 8px;
  font-weight: 500;
  font-size: 13px;
}
.qty {
  font-size: 18px;
  font-weight: 700;
  min-width: 56px;
  text-align: center;
  font-variant-numeric: tabular-nums;
  background: var(--surface);
  color: var(--accent);
  padding: 6px 12px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
}

.ln {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  padding: 16px 20px;
  border-top: 1px solid var(--border);
  font-size: 13px;
  background: var(--surface);
}
.ln span { display: block; }
.ln.in b { color: var(--success); }
.ln.out b { color: var(--danger); }
.ok { color: var(--success); font-weight: 600; }
.bad { color: var(--danger); font-weight: 600; }

.x {
  all: unset;
  cursor: pointer;
  color: var(--muted);
  font-size: 18px;
  width: 32px;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius);
  background: var(--card);
  transition: background 0.2s, color 0.2s;
}
.x:hover { background: var(--danger-bg); color: var(--danger); }

.empty {
  color: var(--muted);
  text-align: center;
  padding: 60px 20px;
  font-size: 14px;
  background: var(--card);
  border-radius: var(--radius);
  border: 1px dashed var(--border);
  margin: 20px 0;
}

.seg {
  display: flex;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 4px;
  margin-bottom: 24px;
  gap: 4px;
}
.seg button {
  all: unset;
  flex: 1;
  text-align: center;
  padding: 12px;
  cursor: pointer;
  border-radius: var(--radius);
  color: var(--muted);
  font-weight: 600;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  transition: all 0.2s ease;
}
.seg .on {
  background: var(--text);
  color: var(--bg);
}

nav {
  position: fixed;
  inset-inline: 16px;
  bottom: 16px;
  max-width: 608px;
  margin: 0 auto;
  display: flex;
  background: rgba(18, 18, 21, 0.95);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 6px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.6);
  z-index: 9;
}
nav button {
  all: unset;
  flex: 1;
  text-align: center;
  padding: 12px 4px;
  cursor: pointer;
  font-size: 11.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  border-radius: var(--radius);
  transition: all 0.2s ease;
}
nav button:hover { color: var(--text); background: var(--surface-hover); }
nav .on {
  color: var(--bg);
  background: var(--text);
}

#msg {
  position: fixed;
  inset-inline: 20px;
  bottom: 90px;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
  display: none;
  z-index: 100;
  box-shadow: 0 15px 30px rgba(0,0,0,0.5);
  font-weight: 600;
  text-align: center;
  font-size: 13.5px;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

button:focus-visible, input:focus-visible {
  outline: 1px solid var(--text);
  outline-offset: 1px;
}

.sr { display: flex; gap: 10px; margin-top: 8px; }
.sr input { margin: 0; flex: 1; }
.sr .btn { width: auto; margin: 0; height: 50px; padding: 0 20px; }

#scan {
  position: fixed;
  inset: 0;
  z-index: 999;
  background: #000;
  display: flex;
  flex-direction: column;
}
#scan[hidden] { display: none; }
#scan video { flex: 1; width: 100%; min-height: 0; object-fit: cover; }
#scan .aim {
  position: absolute;
  inset-inline: 15%;
  top: 45%;
  height: 2px;
  background: var(--accent);
  box-shadow: 0 0 15px var(--accent);
}
#scan .bar {
  padding: 24px;
  padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  background: var(--card);
  text-align: center;
  border-top: 1px solid var(--border);
}

.available {
  padding: 16px;
  border-radius: var(--radius);
  background: var(--success-bg);
  border: 1px solid rgba(34, 197, 94, 0.2);
  margin: 14px 0 20px;
  font-weight: 500;
  color: var(--success);
  font-size: 13.5px;
}
.available b { color: var(--success); font-weight: 700; }

.about-card { text-align: center; padding: 50px 24px; }
.about-dev { font-size: 18px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; margin: 0 0 8px; color: var(--text); direction: ltr; }
.about-ver { font-size: 12px; color: var(--muted); margin: 0; letter-spacing: 0.2em; text-transform: uppercase; direction: ltr; }

.auth-box {
  max-width: 400px;
  margin: 80px auto;
  padding: 36px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: 0 25px 50px rgba(0,0,0,0.6);
  text-align: center;
}
.auth-box h2 { margin: 0 0 24px; font-size: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text); }

.pr-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
.pr-stat{background:var(--surface);border:1px solid var(--border);padding:14px;border-radius:var(--radius)}
.pr-stat b{display:block;font-size:20px;margin-top:4px}
.pr-line{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin:12px 0}
.pr-line-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pr-line label{margin-bottom:10px}
.pr-line input,.pr-line select{height:44px}
.pr-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pr-card{padding:18px}
.pr-badge{display:inline-block;padding:4px 9px;border:1px solid var(--border);border-radius:20px;font-size:11px;color:var(--muted)}
.pr-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pr-actions .btn{width:auto;flex:1;min-width:120px}
.pr-empty-note{padding:12px;background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);color:var(--muted);font-size:12px;margin:10px 0}
.erp-wrap{padding:8px 0 28px}
.erp-welcome{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin:10px 0 22px}
.erp-welcome h2{font-size:25px;margin:0 0 5px}.erp-welcome p{margin:0;color:var(--muted)}
.erp-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:16px 0 24px}
.erp-kpi{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:17px;min-height:105px}
.erp-kpi span{color:var(--muted);font-size:12px}.erp-kpi b{display:block;font-size:27px;margin-top:7px}
.erp-section-title{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px}.erp-section-title h3{margin:0}
.erp-modules{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.erp-module{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:right;min-height:116px;cursor:pointer;color:var(--text);font:inherit}
.erp-module:hover{border-color:var(--accent);background:var(--surface-hover)}.erp-module b{display:block;font-size:15px;margin:8px 0 4px}.erp-module small{color:var(--muted)}
.erp-module .ico{font-size:21px}.erp-module.disabled{opacity:.62;cursor:default}
.erp-lower{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-top:18px}.erp-panel{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;min-width:0}
.erp-panel h3{margin:0 0 12px}.erp-row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--border);font-size:13px}
.erp-tag{font-size:11px;border:1px solid var(--border);border-radius:30px;padding:3px 8px;color:var(--muted);white-space:nowrap}
@media(max-width:760px){.erp-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.erp-modules{grid-template-columns:repeat(2,minmax(0,1fr))}.erp-lower{grid-template-columns:1fr}.erp-welcome h2{font-size:21px}nav{overflow-x:auto;justify-content:flex-start}nav button{min-width:75px;flex:0 0 auto}}
@media(max-width:420px){.pr-grid{grid-template-columns:1fr}.pr-actions .btn{min-width:100%}nav button{font-size:10px;padding-inline:5px}.erp-kpi{padding:12px}.erp-kpi b{font-size:23px}}


.erp-table-wrap{overflow:auto;border:1px solid var(--border);border-radius:8px;margin:12px 0 22px}.erp-table{width:100%;border-collapse:collapse;min-width:560px;font-size:12px}.erp-table th,.erp-table td{padding:11px 10px;border-bottom:1px solid var(--border);text-align:right;white-space:nowrap}.erp-table th{color:var(--muted);background:var(--surface);font-weight:600}.erp-table tr:last-child td{border-bottom:0}.erp-section-title{margin:18px 0 12px}.erp-section-title h3{margin:0}.erp-module{cursor:pointer}.erp-module:disabled{opacity:.5}.form h3{margin-top:0}.erp-table-wrap+ .form{margin-top:20px}

const EQUIP_HINTS=[
 [/valve|محبس|صمام|بلف/i,'صمام للتحكم في فتح وغلق وتنظيم تدفق السوائل أو الغازات في الخطوط'],

 [/gauge|manometer|عداد|مقياس ضغط/i,'عداد لقياس ومراقبة مستوى الضغط أو الحرارة في المعدات'],
 [/sensor|transmitter|حساس|مستشعر/i,'حساس إلكتروني لقياس الضغط أو الحرارة أو التدفق وإرسال القراءات للتحكم'],
 [/flange|فلانش|شفة/i,'وصلة ربط معدنية لتوصيل المواسير والمحابس ببعضها بإحكام'],
 [/bop|blowout|مانع انفجار/i,'صمام أمان رئيسي يُركب على رأس البئر لمنع تدفق السوائل والغازات'],
 [/filter|strainer|فلتر|مصفا/i,'وحدة تنقية لاحتجاز الشوائب والرواسب وحماية المضخات والخطوط'],
 [/pipe|tubing|casing|ماسور|أنبوب/i,'أنبوب معدني لنقل النفط أو الغاز أو سوائل الحفر وتبطين الآبار'],
 [/compressor|كمبريسور|ضاغط/i,'ضاغط لرفع ضغط الغاز أو الهواء اللازم لتشغيل المعدات'],
 [/regulator|منظم/i,'منظم لتثبيت وتخفيض ضغط الغاز أو السوائل عند مستوى آمن'],
 [/actuator|مشغل/i,'وحدة تشغيل آلية لفتح وغلق الصمامات عن بُعد'],
 [/bit|دقاق|رأس حفر/i,'رأس حفر لاختراق الطبقات الصخرية أثناء عمليات حفر آبار البترول والغاز']
];

function suggestDesc(name){
 if(!name)return '';
 for(const [rx,txt] of EQUIP_HINTS){
  if(rx.test(name))return txt;
 }
 return '';
}

function parseScan(raw){
 const txt=String(raw||'').trim();
 if(!txt)return {name:'',serial:'',model:'',location:'',size:'',hasTags:false};

 const flat=txt.replace(/[\r\n]+/g,' | ');
 const rxSerial=/(?:^|[\s|,;\/\-])(?:serial(?:\s*(?:no|number|#))?|s\/n|sn|n\*|\*n)\s*[:=\-#]?\s*([a-zA-Z0-9\-_\/\.]+)/i;
 const rxPn=/(?:^|[\s|,;\/\-])(?:p\/n|pn|part\s*(?:no|number|#)?)\s*[:=\-#]?\s*([a-zA-Z0-9\-_\/\.]+)/i;
 const rxModel=/(?:^|[\s|,;\/\-])(?:model(?:\s*(?:no|number|#))?|mod|m\/n|mn|موديل|طراز)\s*[:=\-#]?\s*([a-zA-Z0-9\u0600-\u06FF\-_\/\.]+)/i;
 const rxLoc=/(?:^|[\s|,;\/\-])(?:zone|loc|location|مكان|منطقة)\s*[:=\-#]?\s*([a-zA-Z0-9\(\)\s\u0600-\u06FF\-_\/\.]+)/i;
 const rxSize=/(?:^|[\s|,;\/\-])(?:size|مقاس|المقاس)\s*[:=\-#]?\s*([^\s|,;]+(?:\s*(?:inch|in|mm|cm|بوصة|مم|سم|"))?)/i;

 const mSer=flat.match(rxSerial);
 const mPn=flat.match(rxPn);
 const mMod=flat.match(rxModel);
 const mLoc=flat.match(rxLoc);
 const mSiz=flat.match(rxSize);

 let serial=mSer?mSer[1]:(mPn?mPn[1]:'');
 let model=mMod?mMod[1]:(mSer&&mPn?mPn[1]:'');
 let location=mLoc?mLoc[1].trim():'';
 let size=mSiz?mSiz[1].trim():'';
 const hasTags=Boolean(mSer||mPn||mMod||mLoc||mSiz||/[|;\n]/.test(txt));

 let name='';
 const rxFirstTag=/(?:^|[\s|,;\/\-])(?:serial(?:\s*(?:no|number|#))?|s\/n|sn|n\*|\*n|p\/n|pn|part\s*(?:no|number|#)?|model(?:\s*(?:no|number|#))?|mod|m\/n|mn|موديل|طراز|zone|loc|location|مكان|منطقة|size|مقاس|المقاس)\s*[:=\-#]?\s*[a-zA-Z0-9\u0600-\u06FF\-_\/\.]+/i;
 const tagMatch=flat.match(rxFirstTag);

 if(tagMatch){
  name=flat.slice(0,tagMatch.index).split(/[|;]/)[0].replace(/[\s|,;:\-]+$/,'').trim();
 }else if(/[|;\n]/.test(txt)){
  const parts=flat.split(/[|;]/).map(p=>p.trim()).filter(Boolean);
  name=parts[0]||'';
  if(!serial&&parts[1])serial=parts[1];
  if(!model&&parts[2])model=parts[2];
 }else if(!/\s/.test(txt)){
  serial=txt;
 }else{
  name=txt;
 }

 return {name,serial,model,location,size,hasTags};
}

function rebuild(){
 M=Array.isArray(M)?M:[];
}

function groups(){
 const g=new Map();

 for(const e of M){
  if(!e.ok)continue;
  const k=K(e.s)||K(e.n);
  let x=g.get(k);

  if(!x){
   x={k,s:e.s,n:e.n,model:e.model||'',size:e.size||'',desc:e.desc||'',q:0,w:'',d:'',l:[]};
   g.set(k,x);
  }

  x.q+=e.t==='in'?e.q:-e.q;
  x.l.push(e);

  if(e.d>=x.d){
   x.d=e.d;
   x.n=e.n||x.n;
   x.s=e.s||x.s;
   x.model=e.model||x.model;
   x.size=e.size||x.size;
   x.desc=e.desc||x.desc;
  }

  if(e.model)x.model=e.model;
  if(e.size)x.size=e.size;
  if(e.desc)x.desc=e.desc;
  if(e.w)x.w=e.w;
 }

 return g;
}

function findItem(value){
 const v=K(value);
 if(!v)return null;
 const all=[...groups().values()];
 return all.find(x=>K(x.s)===v||K(x.n)===v)
 ||all.find(x=>K(x.s).includes(v)||K(x.n).includes(v)||K(x.model)===v||K(x.w).includes(v))
 ||null;
}

function applyScannedText(rawText,showMessage=true){
 const sEl=$('#s');
 if(!sEl)return;
 const parsed=parseScan(rawText);

 if(parsed.serial)sEl.value=parsed.serial;
 if(parsed.name&&$('#n'))$('#n').value=parsed.name;
 if(parsed.model&&$('#model'))$('#model').value=parsed.model;
 if(parsed.location&&$('#w'))$('#w').value=parsed.location;
 if(parsed.size&&$('#size'))$('#size').value=parsed.size;

 const lookupKey=parsed.serial||parsed.name||sEl.value;
 const x=findItem(lookupKey);
 selectedItem=x;

 if(x){
  if(!$('#n').value)$('#n').value=x.n||'';
  if(!$('#model').value)$('#model').value=x.model||'';
  if(!$('#size').value)$('#size').value=x.size||'';
  if(!$('#desc').value)$('#desc').value=x.desc||'';
  if(!$('#w').value)$('#w').value=x.w||'';
  updateAvailable(x.q,true);
  if(showMessage)say(parsed.hasTags?'تم تحليل الباركود وملء البيانات تلقائيًا':'تم ملء بيانات الصنف تلقائيًا');
 }else{
  updateAvailable(0,false);
  const currentName=$('#n').value.trim();
  if(currentName&&$('#desc')&&!$('#desc').value.trim()){
   const hint=suggestDesc(currentName);
   if(hint)$('#desc').value=hint;
  }
  if(showMessage)say(parsed.hasTags?'تم استخراج بيانات الباركود. راجعها وأكمل الناقص':'الصنف غير مسجل. أدخل بياناته أول مرة');
 }
}

function fillItem(showMessage=true){
 const s=$('#s');
 if(!s)return;
 applyScannedText(s.value,showMessage);

async function loadStockSearch(resetPage=false){
 if(!db||!loggedIn)return;
 if(resetPage)stockSearchPage=0;
 const request=++stockSearchRequest;
 stockSearchLoading=true;stockSearchError='';
 const list=$('#list');if(list)list.innerHTML='<div class="stock-no-results"><span>⌕</span><b>جاري البحث داخل قاعدة البيانات</b><small>يتم جلب صفحة النتائج المطلوبة فقط.</small></div>';
 try{
  const {data,error}=await db.rpc('wh_search_stock',{
   p_search:q.trim()||null,p_kind:stockFilter,p_page:stockSearchPage,p_page_size:STOCK_PAGE_SIZE
  });
  if(error)throw error;
  if(request!==stockSearchRequest)return;
  const payload=typeof data==='string'?JSON.parse(data):data;
  stockSearchTotal=Number(payload?.total_count||0);
  stockSearchItems=(payload?.items||[]).map(row=>{
   const it=row.item||{};
   const lines=(row.movements||[]).map(m=>{
    const raw=String(m.kind||'').toLowerCase();
    const kind=['in','دخول','استلام','receipt','inbound','add','إضافة','توريد'].includes(raw)?'in':'out';
    const reviewed=!!m.reviewed_at||['reviewed','approved','مراجع','تمت المراجعة','معتمد'].includes(String(m.status||'').toLowerCase());
    return {i:m.id,c:'db',t:kind,s:it.serial_number||it.barcode||'',n:it.name||'',model:it.model||'',size:it.size||'',desc:it.description||'',q:Number(m.qty||0),d:m.movement_date||m.created_at?.slice(0,10)||today(),created_at:m.created_at||'',w:m.warehouse_location||it.location||'',p:m.party||'',r:m.person||'',j:m.job_ref||'',note:m.note||'',reference_number:m.reference_number||'',site_id:m.site_id||'',status:m.status||'',attachment_path:m.attachment_path||'',ok:reviewed,item_id:m.item_id};
   });
   const first=lines[0]||{};
   return {k:K(it.serial_number||it.name),s:it.serial_number||it.barcode||'',n:it.name||'',model:it.model||'',size:it.size||'',desc:it.description||'',q:Number(row.balance||0),w:it.location||'',d:row.last_date||first.d||'',l:lines};
  });
  stockSearchLoading=false;
  const current=$('#list');if(current)current.innerHTML=stockList();
 }catch(e){
  if(request!==stockSearchRequest)return;
  stockSearchLoading=false;stockSearchError=e.message||'تعذر البحث';
  const current=$('#list');if(current)current.innerHTML=`<div class="stock-no-results"><span>!</span><b>تعذر تنفيذ البحث من قاعدة البيانات</b><small>${esc(stockSearchError)}</small><button class="btn ghost" data-a="stock-retry">إعادة المحاولة</button></div>`;
 }
}

async function savePurchaseRequest(status){
 const val=id=>document.getElementById(id)?.value?.trim()||'';
 const requestDate=val('pr-date')||today(),requiredDate=val('pr-required');
 if(requiredDate&&requiredDate<requestDate)return say('تاريخ الاحتياج لازم يكون نفس تاريخ الطلب أو بعده');
 const lines=[...document.querySelectorAll('#pr-lines .pr-line')].map(el=>{
  const get=k=>el.querySelector(`[data-field="${k}"]`)?.value?.trim()||'';
  return {existing_item_id:get('existing_item_id')||null,item_description:get('item_description'),quantity:Number(get('quantity')),unit:get('unit')||null,estimated_unit_price:get('estimated_unit_price')===''?null:Number(get('estimated_unit_price')),notes:get('notes')||null};
 });
 if(!lines.length||lines.some(x=>!x.item_description||!Number.isFinite(x.quantity)||x.quantity<=0||x.estimated_unit_price!==null&&(!Number.isFinite(x.estimated_unit_price)||x.estimated_unit_price<0)))return say('راجع وصف كل صنف والكمية والسعر التقديري');
 const requestNumber=`PR-${requestDate.replaceAll('-','')}-${Date.now().toString().slice(-6)}`;
 const payload={request_number:requestNumber,requester_id:authSession.user.id,department_id:val('pr-department')||null,project_id:val('pr-project')||null,site_id:val('pr-site')||null,request_date:requestDate,required_date:requiredDate||null,priority:val('pr-priority')||'normal',purpose:val('pr-purpose')||null,status};
 const buttons=[...document.querySelectorAll('[data-a="savepr"]')];buttons.forEach(b=>b.disabled=true);
 try{
  const {data:created,error}=await db.from('erp_purchase_requests').insert(payload).select().single();
  if(error)throw error;
  const itemPayload=lines.map(x=>({...x,request_id:created.id}));
  const {error:itemError}=await db.from('erp_purchase_request_items').insert(itemPayload);
  if(itemError){
   console.error('Purchase request item save failed:',itemError);
   await db.from('erp_purchase_requests').delete().eq('id',created.id);
   throw new Error('لم يتم حفظ بنود الطلب، تم التراجع عن رأس الطلب. '+itemError.message);
  }
  if(status==='submitted'){
   const {error:approvalError}=await db.from('erp_approvals').insert({document_type:'purchase_request',document_id:created.id,step_number:1,approver_id:null,status:'pending'});
   if(approvalError){await db.from('erp_purchase_request_items').delete().eq('request_id',created.id);await db.from('erp_purchase_requests').delete().eq('id',created.id);throw new Error('تعذر إنشاء سجل الاعتماد، لم يتم إرسال الطلب. '+approvalError.message);}
   const {error:statusError}=await db.from('erp_purchase_requests').update({status:'pending_approval',updated_at:new Date().toISOString()}).eq('id',created.id);
   if(statusError)throw statusError;
  }
  await loadDatabase();
  full();
  say(`تم حفظ طلب الشراء ${requestNumber}${status==='submitted'?' وإرساله للاعتماد':''}`);
 }catch(e){
  console.error('Purchase request save failed:',e);
  say('فشل حفظ طلب الشراء: '+(e.message||'راجع صلاحيات المشتريات'));
 }finally{buttons.forEach(b=>b.disabled=false)}
}

function moduleHeader(title,desc){return `<div class="erp-section-title"><h3>${title}</h3><span class="erp-tag">${desc}</span></div>`}
function field(label,id,placeholder='',type='text',required=false){return `<label>${label}<input id="${id}" type="${type}" placeholder="${placeholder}" ${required?'required':''}></label>`}
function selectField(label,id,rows,placeholder='اختر'){return `<label>${label}<select id="${id}"><option value="">${placeholder}</option>${rows.map(x=>`<option value="${esc(x.id)}">${esc(x.name||x.request_number||x.order_number||x.code||x.project_code||x.site_code||x.asset_code||x.id)}</option>`).join('')}</select></label>`}
function rowsTable(rows,cols,empty){
 if(!rows?.length)return `<p class="empty">${empty}</p>`;
 const body=rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(typeof c[2]==='function'?c[2](r):(r[c[0]]??'-'))}</td>`).join('')}</tr>`).join('');
 return `<div class="erp-table-tools"><input type="search" class="erp-table-search" data-table-search placeholder="ابحث داخل الجدول..." aria-label="بحث داخل الجدول"><span class="erp-table-count">${rows.length} سجل</span></div><div class="erp-table-wrap"><table class="erp-table"><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`
}

async function saveModule(table,payload,label){return withWriteLock('insert:'+table,async()=>{try{const {data,error}=await db.from(table).insert(payload).select('id').single();if(error)throw error;await writeAudit('create','erp',table,data?.id,payload);await loadDatabase();full();say(`تم حفظ ${label} بنجاح`);}catch(e){console.error(table,e);say(`فشل الحفظ: ${e.message||'تحقق من صلاحيات الجدول وأسماء الحقول'}`)}})}
async function decideApproval(id,status){try{const note=$(`#approval-note-${CSS.escape(id)}`)?.value?.trim()||null;const {data,error}=await db.from('erp_approvals').update({status,decision_note:note,decided_at:new Date().toISOString()}).eq('id',id).select().single();if(error)throw error;if(data.document_type==='purchase_request'){const next=status==='approved'?'approved':'rejected';const {error:pe}=await db.from('erp_purchase_requests').update({status:next,updated_at:new Date().toISOString()}).eq('id',data.document_id);if(pe)throw pe;}if(data.document_type==='asset_movement'){const {data:move,error:me}=await db.from('erp_asset_movements').update({status:status==='approved'?'approved':'rejected',approved_by:authSession.user.id}).eq('id',data.document_id).select().single();if(me)throw me;if(status==='approved'){const {error:ae}=await db.from('wh_assets').update({site_id:move.to_site_id}).eq('id',move.asset_id);if(ae)throw ae;}}await loadDatabase();full();say(status==='approved'?'تم اعتماد الطلب':'تم رفض الطلب');}catch(e){say('تعذر تسجيل القرار: '+e.message)}}

async function doLogin(){
 const code=$('#loginCode')?.value.trim()||'';
 const pass=$('#loginPass')?.value||'';

 if(!code||!pass){
  say('اكتب كود المستلم والرقم السري');
  return;
 }

 const btn=document.querySelector('[data-a="dologin"]');

 if(btn){
  btn.disabled=true;
  btn.textContent='جاري التحقق...';
 }

 try{
  const response=await fetch(LOGIN_FUNCTION_URL,{
   method:'POST',
   headers:{
    'Content-Type':'application/json',
    'apikey':SUPABASE_PUBLISHABLE_KEY
   },
   body:JSON.stringify({
    employee_code:code,
    password:pass
   })
  });

  let result;

  try{
   result=await response.json();
  }catch(e){
   throw new Error('استجابة السيرفر غير مفهومة');
  }

  if(!response.ok){
   throw new Error(result.error||'فشل تسجيل الدخول');
  }

  if(!result.session?.access_token){
   throw new Error('السيرفر لم يرجع جلسة صالحة');
  }

  if(!result.profile?.id||!result.profile?.role||result.session.user?.id!==result.profile.id){
   throw new Error('بيانات الموظف أو الجلسة غير متطابقة');
  }

  authSession=result.session;
  authProfile=result.profile;

  sessionStorage.setItem(
   'warehouse_session',
   JSON.stringify(authSession)
  );

  sessionStorage.setItem(
   'warehouse_profile',
   JSON.stringify(authProfile)
  );

  loggedIn=true;
  touchSession();
  tab='stock';
  q='';
  ready=false;
  full();
  say('تم تسجيل الدخول، جاري تحميل بيانات المخزن');
  await initDatabase();
  say('أهلاً بك '+(authProfile.full_name||''));

 }catch(error){

  console.error('Login error:',error);

  clearSession();
  full();

  say(error.message||'تعذر تسجيل الدخول');

 }finally{

  const currentBtn=document.querySelector('[data-a="dologin"]');

  if(currentBtn){
   currentBtn.disabled=false;
   currentBtn.textContent='تسجيل الدخول';
  }
 }
}

const activeWrites=new Set();
async function withWriteLock(key,work){
 if(activeWrites.has(key)){say('العملية قيد التنفيذ بالفعل. انتظر انتهاء الحفظ');return;}
 activeWrites.add(key);
 try{return await work();}finally{activeWrites.delete(key);}
}
async function writeAudit(action,module,table,recordId,newData,oldData=null){
 try{
  const payload={actor_id:authSession?.user?.id||null,action,module,record_table:table,record_id:recordId||null,old_data:oldData,new_data:newData||null};
  const {error}=await db.from('erp_audit_logs').insert(payload);
  if(error)console.warn('Audit log not recorded:',error.message);
 }catch(e){console.warn('Audit log unavailable:',e.message)}
}

async function saveM(){
 return withWriteLock("warehouse-movement",async()=>{
  const g=id=>$('#'+id)?$('#'+id).value.trim():'';
  const t=type,rawQty=g('qt'),qty=Number(rawQty),serial=g('s'),name=g('n'),model=g('model'),size=g('size'),desc=g('desc');

let stream=null,st=0;

async function scan(target){
 if(!('BarcodeDetector' in window))
  return say('الكاميرا هنا مش بتقرا الباركود. اكتب الرقم أو استخدم سكانر');

 try{
  stream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:{ideal:'environment'}},audio:false
  });
 }catch(e){
  return say('اسمح للتطبيق باستخدام الكاميرا');
 }

 const v=$('#sv');
 v.srcObject=stream;
 try{await v.play()}catch(e){}
 $('#scan').hidden=false;

 const det=new BarcodeDetector();

 const tick=async()=>{
  if(!stream)return;
  try{
   const r=await det.detect(v);
   if(r.length&&r[0].rawValue){
    const val=r[0].rawValue;
    scanStop();
    navigator.vibrate&&navigator.vibrate(80);
    got(target,val);
    return;
   }
  }catch(e){}
  st=setTimeout(tick,250);
 };
 tick();
}

function scanStop(){
 clearTimeout(st);
 if(stream)stream.getTracks().forEach(t=>t.stop());
 stream=null;
 $('#scan').hidden=true;
}

function got(target,val){
 const el=$('#'+target);
 if(!el)return;
 if(target==='q'){
  const parsed=parseScan(val);
  const searchVal=parsed.serial||parsed.name||val;
  el.value=searchVal;
  q=searchVal;
  more=100;
  refresh();
  return;
 }
 if(target==='s'){
  applyScannedText(val,true);
  ($('#n').value?$('#qt'):$('#n')).focus();
 }
}

document.addEventListener('input',ev=>{
 warned=false;

 if(ev.target.id==='q'){
  q=ev.target.value;
  more=100;
  scheduleStockSearch();
 }

 if(ev.target.id==='s'){
  const val=ev.target.value.trim();
  if(val){
   const parsed=parseScan(val);
   if(parsed.hasTags){
    if(parsed.name&&!$('#n').value)$('#n').value=parsed.name;
    if(parsed.model&&!$('#model').value)$('#model').value=parsed.model;
    if(parsed.location&&!$('#w').value)$('#w').value=parsed.location;
    if(parsed.size&&!$('#size').value)$('#size').value=parsed.size;
   }

   const x=findItem(parsed.serial||val);
   if(x){
    selectedItem=x;
    $('#n').value=x.n||'';
    if($('#model'))$('#model').value=x.model||'';
    $('#size').value=x.size||'';
    if($('#desc'))$('#desc').value=x.desc||'';
    $('#w').value=x.w||'';
    updateAvailable(x.q,true);
   }else{
    selectedItem=null;
    updateAvailable(0,false);
   }
  }else{
   selectedItem=null;
   updateAvailable(0,false);
  }
 }

 if(ev.target.id==='n'){
  const val=ev.target.value.trim();
  if(val&&$('#desc')&&!$('#desc').value.trim()){
   const hint=suggestDesc(val);
   if(hint)$('#desc').value=hint;
  }
 }
});

  const line=ev.target.closest('.pr-line');
  if(item&&line){
   line.querySelector('[data-field="item_description"]').value=item.name||'';
   line.querySelector('[data-field="unit"]').value=item.unit||'قطعة';
  }

});
